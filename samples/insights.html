<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Insights</title>
<!-- Synthetic demo page for Vortex tests (TradeHub sample app). No real data. -->
<style>
  body { margin: 0; font: 15px/1.4 Roboto, Arial, sans-serif; color: #1c2430; background: #f4f6fa; }
  header { background: #fff; padding: 14px 16px 10px; border-bottom: 1px solid #e2e6ee; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { margin: 0; color: #6b7588; font-size: 12px; }
  .rates { margin: 12px; background: #fff; border-radius: 10px; border: 1px solid #e2e6ee; }
  .rate-row { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #eef1f6; }
  .rate-row:last-child { border-bottom: 0; }
  .name { flex: 1; font-weight: 600; }
  .price { color: #2a7a3b; font-variant-numeric: tabular-nums; }
  .watch { border: 1px solid #2f5bd3; color: #2f5bd3; background: #fff; border-radius: 16px; padding: 4px 12px; font: inherit; font-size: 13px; }
  .watch[aria-pressed="true"] { background: #2f5bd3; color: #fff; }
  form { margin: 12px; background: #fff; border-radius: 10px; border: 1px solid #e2e6ee; padding: 12px; }
  label { display: block; font-size: 13px; color: #44506a; margin-bottom: 6px; }
  input[type=email] { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 10px; border: 1px solid #c6cdda; border-radius: 8px; }
  button[type=submit] { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2f5bd3; color: #fff; font: inherit; font-weight: 600; }
  #status { min-height: 20px; margin: 8px 0 0; color: #2a7a3b; font-size: 13px; }
  iframe { display: block; margin: 12px; width: calc(100% - 24px); height: 92px; border: 1px solid #e2e6ee; border-radius: 10px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1 id="page-title">Metal rates today</h1>
  <p class="sub">Synthetic demo data</p>
</header>
<section class="rates" aria-label="Rates">
  <div class="rate-row" data-metal="steel"><span class="name">TMT Steel</span><span class="price">52,400 / t</span><button class="watch" type="button" aria-pressed="false">Watch</button></div>
  <div class="rate-row" data-metal="copper"><span class="name">Copper</span><span class="price">8,910 / t</span><button class="watch" type="button" aria-pressed="false">Watch</button></div>
  <div class="rate-row" data-metal="aluminium"><span class="name">Aluminium</span><span class="price">2,340 / t</span><button class="watch" type="button" aria-pressed="false">Watch</button></div>
</section>
<form id="subscribe-form">
  <label for="email">Email for daily rates</label>
  <input id="email" name="email" type="email" placeholder="you@example.com" data-testid="subscribe-email" autocomplete="off">
  <button id="ember1734" type="submit" data-testid="subscribe-btn">Subscribe</button>
  <p id="status" role="status" aria-live="polite"></p>
</form>
<iframe id="alerts-frame" title="Price alerts" srcdoc="<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px Roboto,Arial,sans-serif;color:#1c2430}p{margin:6px 0 0;color:#6b7588;font-size:12px}</style></head><body><label><input type='checkbox' id='alert-toggle'> Alert me when steel drops</label><p id='alert-state'>Alerts off</p><script>document.getElementById('alert-toggle').addEventListener('change',function(e){document.getElementById('alert-state').textContent=e.target.checked?'Alerts on':'Alerts off'});</script></body></html>"></iframe>
<script>
  document.getElementById('subscribe-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('email').value.trim();
    document.getElementById('status').textContent = v ? 'Subscribed: ' + v : 'Enter an email address';
  });
  document.querySelectorAll('.watch').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? 'Watching' : 'Watch';
    });
  });
</script>
</body>
</html>
